# ====================
# Base Configuration
# ====================
sonar.projectKey=revisium_template-nestjs-api
sonar.organization=revisium

# ====================
# Coverage Settings
# ====================
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# ====================
# Standard Exclusions
# ====================
sonar.exclusions=**/__tests__/**,**/__mocks__/**,**/*.spec.ts,prisma/**/*,src/__generated__/**
sonar.coverage.exclusions=**/*.module.ts,**/__tests__/**,**/__mocks__/**,**/*.spec.ts,prisma/**/*,src/__generated__/**,src/main.ts,src/**/index.ts

# ====================
# Issue Ignore Rules
# ====================
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,fp1,fp2

sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.command.ts

sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.query.ts

sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2094
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.command.ts

sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S2094
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.query.ts

sonar.issue.ignore.multicriteria.fp1.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.fp1.resourceKey=src/__tests__/**

sonar.issue.ignore.multicriteria.fp2.ruleKey=plsql:VarcharUsageCheck
sonar.issue.ignore.multicriteria.fp2.resourceKey=prisma/migrations/**

# ====================
# Duplicate Code Exclusions
# ====================
sonar.cpd.exclusions=**/*.spec.ts,src/__generated__/**,src/__tests__/**,src/api/mcp-api/tools/*.tools.ts
